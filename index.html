  <title>Je Trouve Mon Chemin</title>
  <meta name="description" content="La méthode infaillible pour se trouver, même quand tout part en vrille." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jetrouvemonchemin.com/" />
  <meta property="og:title" content="Je Trouve Mon Chemin" />

  <style>
    :root {
      --color-main: #d7e5e3;
      --color-secondary: #7e939a;

      --bg-1: #15594b;
      --bg-2: #203a43;
      --bg-3: #0f2027;

      --max-width: 800px;
      --padding: 1rem;

      --font-main: clamp(2rem, 4vw, 3rem);
      --font-small: clamp(0.9rem, 1.5vw, 1.1rem);
      --font-title: clamp(0.9rem, 1.3vw, 1.1rem);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      color: var(--color-main);
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      padding: var(--padding);
      text-align: center;
      display: flex;
      flex-direction: column;
      
      min-height: 100vh;
    }

    h1 {
      font-size: var(--font-title);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-secondary);
      margin-top: 0.5rem;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .main-text {
      font-size: var(--font-main);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: var(--color-main);
      text-wrap: balance;
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }

    .author,
    .secondary-text {
      font-weight: 300;
      color: var(--color-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-wrap: balance;
      max-width: 40ch;
    }

    .author {
      font-size: var(--font-small);
    }

    .secondary-text {
      font-size: calc(var(--font-small) * 1.2);
    }

    a.social {
      display: inline-block;
      width: 1.5rem;
      height: 1.5rem;
      color: var(--color-secondary);
    }
  </style>
</head>

    <h1>Je Trouve Mon Chemin</h1>

    <div class="content">
      <div class="main-text">
        Le seul endroit où tu trouveras <i>ton</i> chemin, c'est en toi 🫵
      </div>
      <div class="secondary-text">
        <p>Si tu cherches encore, c'est OK. Et si les gens te jugent pour ça, invite-les cordialement à aller se faire foutre.</p>

    </div>
